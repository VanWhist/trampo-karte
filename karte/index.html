<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瑛斗・颯斗 選手カルテ</title>
<style>
  :root {
    --surface-1: #ffffff;
    --page: #f4f5f7;
    --text-primary: #0b0b0b;
    --text-secondary: #55575c;
    --text-muted: #8a8d93;
    --gridline: #e7e8ec;
    --border: rgba(11,11,11,0.08);
    --blue-450: #2a78d6;
    --blue-250: #86b6ef;
    --blue-550: #1c5cab;
    --accent-soft: #eaf2fc;
    --gold-soft: #fbf3df;
    --gold-line: #d79b00;
    --gold-text: #8a6400;
    --green-soft: #eaf7ef;
    --green-line: #1f9d55;
    --focus-soft: #fef1e6;
    --focus-line: #d1720a;
    --focus-text: #8a4a00;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  .app-title { font-size: 17px; font-weight: 700; text-align: center; margin: 0 0 10px; }
  .segmented { display: flex; background: var(--page); border-radius: 10px; padding: 3px; gap: 2px; }
  .segmented button {
    flex: 1; border: none; background: transparent; padding: 8px 6px; font-size: 14px;
    font-weight: 600; color: var(--text-secondary); border-radius: 8px; font-family: inherit;
  }
  .segmented button.active { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 3px rgba(11,11,11,0.12); }
  .updated-row { display: flex; justify-content: center; margin-top: 8px; font-size: 11.5px; color: var(--text-muted); }
  .app-body { padding: 12px 12px calc(var(--safe-bottom) + 28px); max-width: 480px; margin: 0 auto; }
  .card { background: var(--surface-1); border-radius: 14px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(11,11,11,0.05); border: 1px solid var(--border); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .card-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-450); flex: none; }
  .card-head.gold .dot { background: var(--gold-line); }
  .card-head.green .dot { background: var(--green-line); }
  .card-head h2 { font-size: 13.5px; font-weight: 700; margin: 0; color: var(--text-secondary); letter-spacing: 0.02em; }
  .card-head.clickable { cursor: pointer; transition: opacity 0.08s ease; padding-bottom: 12px; }
  .card-head.clickable:active { opacity: 0.6; }
  .card-body { padding: 0 14px 14px; }
  .field { padding: 8px 0; border-top: 1px solid var(--gridline); }
  .field:first-child { border-top: none; padding-top: 0; }
  .field .k { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .field .v { font-size: 14px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; }
  .field.clickable { cursor: pointer; transition: opacity 0.08s ease; }
  .field.clickable:active { opacity: 0.6; }
  .field .chev { font-size: 17px; color: var(--blue-450); font-weight: 700; opacity: 0.7; vertical-align: -2px; }
  .card-head .chev { font-size: 15px; color: var(--blue-450); font-weight: 700; opacity: 0.7; flex: none; }
  .field.sub { background: var(--gold-soft); border-top: none; border-radius: 8px; padding: 9px 10px; margin: 2px 0 4px; }
  .field.sub .k { color: var(--gold-text); }
  .muted { color: var(--text-muted); font-size: 13px; }

  /* goal tiles (2列グリッド、MIC方式) */
  .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .goal-tile { background: var(--accent-soft); border-radius: 10px; padding: 9px 10px; }
  .goal-tile .k { font-size: 10.5px; color: var(--blue-450); font-weight: 700; margin-bottom: 3px; }
  .goal-tile .v { font-size: 12.5px; line-height: 1.5; color: var(--text-primary); }
  .goal-tile.muted { background: var(--page); opacity: 0.7; }

  /* 自己分析: 横棒グラフ */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; }
  .bar-row .name { font-size: 11px; color: var(--text-secondary); text-align: right; white-space: nowrap; }
  .bar-track { position: relative; height: 16px; background: var(--page); border-radius: 4px; }
  .bar-fill { position: absolute; left: 0; top: 0; height: 16px; border-radius: 4px; display: flex; align-items: center; }
  .bar-fill span { color: #fff; font-size: 10px; font-weight: 700; margin-left: auto; margin-right: 5px; }
  .focus-chip { display: inline-block; font-size: 9.5px; background: var(--gold-soft); color: var(--gold-text); border: 1px solid var(--gold-line); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
  .focus-note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  /* 生活習慣: 4列タイル */
  .life-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .life-tile { background: var(--page); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .life-tile .k { font-size: 9.5px; color: var(--text-muted); margin-bottom: 3px; }
  .life-tile .v { font-size: 12px; font-weight: 700; }

  /* 最後にメッセージ */
  .message-box { background: var(--gold-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-top: 10px; }
  .message-box .k { font-size: 10.5px; color: var(--gold-text); font-weight: 700; margin-bottom: 4px; }
  .btn { display: inline-block; border: none; border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .btn-primary { background: var(--blue-450); color: #fff; }
  .btn-ghost { background: var(--page); color: var(--text-secondary); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text], input[type=number], input[type=url], textarea, select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page); margin-top: 4px; box-sizing: border-box;
  }
  textarea { min-height: 60px; resize: vertical; }
  label.lbl { font-size: 11.5px; color: var(--text-muted); display: block; margin-top: 10px; }
  label.lbl:first-child { margin-top: 0; }

  /* mandala (9x9 live grid, MIC方式) */
  .mandala-grid9 { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: var(--gridline); border: 1px solid var(--gridline); border-radius: 8px; overflow: hidden; }
  .mandala-cell9 {
    background: var(--surface-1); padding: 4px 2px; min-height: 40px;
    font-size: 8.5px; line-height: 1.2; display: flex; align-items: center; justify-content: center;
    text-align: center; word-break: break-all;
  }
  .mandala-cell9.center-goal { background: var(--gold-soft); font-weight: 700; color: var(--gold-text); font-size: 9px; }
  .mandala-cell9.block-center { background: var(--accent-soft); font-weight: 700; color: var(--blue-550); }
  .mandala-cell9.empty { color: var(--text-muted); }
  .mandala-link { font-size: 12.5px; color: var(--blue-450); font-weight: 700; margin-top: 10px; display: inline-block; }
  .mandala-summary { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
  .mandala-empty { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; padding: 4px 2px 10px; }

  /* マンダラ: タップして展開する3x3(MIC方式) */
  .mandala-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mandala-cell { border-radius: 10px; padding: 8px 4px; text-align: center; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .mandala-cell.center { background: var(--gold-soft); border: 1px solid var(--gold-line); }
  .mandala-cell.center .g { font-size: 10.5px; font-weight: 700; color: var(--gold-text); line-height: 1.4; }
  .mandala-cell.center.sub { background: var(--accent-soft); border: 1px solid var(--blue-250); }
  .mandala-cell.center.sub .g { color: var(--blue-550); }
  .mandala-cell.elem { background: var(--page); opacity: 0.7; }
  .mandala-cell.elem.started { background: var(--accent-soft); border: 1px solid var(--blue-250); opacity: 1; }
  .mandala-cell.elem .n { font-size: 11px; font-weight: 700; color: var(--blue-550); margin-bottom: 2px; line-height: 1.3; }
  .mandala-cell.elem .p { font-size: 9px; color: var(--text-muted); }
  .mandala-cell.elem.started .p { color: var(--blue-450); font-weight: 700; }
  .mandala-cell.clickable { cursor: pointer; transition: transform 0.08s ease; position: relative; }
  .mandala-cell.clickable:active { transform: scale(0.95); }
  .mandala-cell.elem.clickable::after { content: "\203A"; position: absolute; top: 0px; right: 3px; font-size: 16px; font-weight: 700; color: var(--blue-450); opacity: 0.6; }
  .mandala-cell.action { background: var(--page); padding: 6px 4px; }
  .mandala-cell.action.filled { background: var(--surface-1); border: 1px solid var(--gridline); }
  .mandala-cell.action .a { font-size: 9.5px; line-height: 1.35; color: var(--text-primary); }
  .mandala-cell.action .a.muted { color: var(--text-muted); font-style: italic; }
  .rating-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--gridline); font-size: 13px; }
  .rating-row:first-child { border-top: none; }
  .rating-row .rn { color: var(--text-secondary); }
  .rating-row .rv { font-weight: 700; color: var(--blue-550); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: var(--accent-soft); color: var(--blue-550); font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .subhead { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 0 4px; }
  .subhead:first-child { margin-top: 0; }

  /* 目標ヒーロー（本人ページ限定・最上部） */
  .hero-card { padding: 20px 18px; text-align: center; }
  .hero-goal { font-size: 21px; font-weight: 800; line-height: 1.45; color: var(--text-primary); }
  .hero-ultimate { font-size: 13.5px; color: var(--text-secondary); margin-top: 8px; line-height: 1.55; }
  .hero-divider { height: 1px; background: var(--gridline); margin: 14px 0; }
  .hero-season .k { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .hero-season .v { font-size: 16px; font-weight: 700; color: var(--blue-550); }
  .hero-message-box { margin-top: 14px; background: var(--gold-soft); border-radius: 10px; padding: 13px 14px; text-align: left; }
  .hero-message-item + .hero-message-item { margin-top: 10px; }
  .hero-message-k { font-size: 11px; font-weight: 700; color: var(--gold-text); opacity: 0.72; margin-bottom: 3px; }
  .hero-message-line { font-size: 21px; font-weight: 700; color: var(--gold-text); line-height: 1.5; }

  /* 大会公式リザルトの得点内訳（本人ページは個人のみ／コーチ用は個人・シンクロとも） */
  .score-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .score-tile { background: var(--accent-soft); border-radius: 10px; padding: 10px 11px; }
  .score-head { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
  .score-sym { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 5px; background: var(--blue-450); color: #fff; font-size: 10.5px; font-weight: 800; flex: none; }
  .score-val { font-size: 21px; font-weight: 800; color: var(--blue-550); margin-top: 6px; line-height: 1.2; }
  .score-max { font-size: 12.5px; font-weight: 700; color: var(--text-muted); }
  .score-note { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; }
  .score-legend { font-size: 11.5px; color: var(--text-secondary); margin-top: 10px; line-height: 1.55; }
  .score-round-gap { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gridline); }
  .official-block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gridline); }
  .official-head { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 7px; display: flex; align-items: baseline; gap: 8px; }
  .official-total { font-size: 12.5px; font-weight: 800; color: var(--blue-550); margin-left: auto; }

  /* できるようになったこと（本人ページ限定・新規） */
  .achieve-row { background: var(--green-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .achieve-main { display: flex; align-items: flex-start; gap: 6px; }
  .achieve-check { color: var(--green-line); font-weight: 700; font-size: 14px; line-height: 1.5; }
  .achieve-text { font-weight: 700; font-size: 15px; line-height: 1.5; color: var(--text-primary); }
  .achieve-reason { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; margin-left: 20px; }
  .achieve-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; margin-left: 20px; }
  .achieve-footer { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  /* 自己分析: 昨年比マーカー・差分・改善ボックス */
  .bar-prev-marker { position: absolute; top: -4px; width: 2px; height: 24px; background: var(--text-muted); opacity: 0.6; }
  .bar-prev-marker::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .bar-diff { font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .bar-diff.up { color: var(--green-line); }
  .bar-diff.flat { color: var(--text-muted); }
  .self-legend { font-size: 10.5px; color: var(--text-muted); margin-top: 10px; display: flex; align-items: center; gap: 5px; line-height: 1.5; }
  .self-legend .dot-marker { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; flex: none; opacity: 0.6; }
  .self-improve-box { background: var(--green-soft); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin-top: 10px; color: var(--text-primary); }

  /* 大会振り返り（コーチ用・新規） */
  .taikai-meet-title { font-size: 15px; font-weight: 700; }
  .taikai-meet-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; margin-bottom: 8px; }
  .taikai-alert { background: var(--focus-soft); border: 1px solid var(--focus-line); color: var(--focus-text); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin: 8px 0; }
  .taikai-footer { background: var(--page); border-radius: 10px; padding: 9px 10px; font-size: 11.5px; color: var(--text-secondary); margin-top: 10px; line-height: 1.6; }
  .taikai-footer .k { font-size: 10.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 3px; }

  /* 今、大事にしたいこと（本人ページ限定のフォーカスカード） */
  .card-head.focus .dot { background: var(--focus-line); }
  .focus-box { background: var(--focus-soft); border-radius: 10px; padding: 10px 12px; }
  .focus-box + .focus-box { margin-top: 8px; }
  .focus-box .k { font-size: 10.5px; color: var(--focus-text); font-weight: 700; margin-bottom: 3px; }
  .focus-box .v { font-size: 13.5px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; }

  /* 本人ページ（player-mode）: 文字を大きめに、生活習慣タイルを2列に */
  .player-mode .life-grid { grid-template-columns: repeat(2, 1fr); }
  .player-mode .life-tile .k { font-size: 11px; }
  .player-mode .life-tile .v { font-size: 13.5px; }
  .player-mode .card-head h2 { font-size: 14.5px; }
  .player-mode .field .k { font-size: 12px; }
  .player-mode .field .v { font-size: 15px; }
  .player-mode .goal-tile .k { font-size: 11.5px; }
  .player-mode .goal-tile .v { font-size: 13.5px; }
  .player-mode .bar-row { grid-template-columns: 108px 1fr; }
  .player-mode .bar-row .name { font-size: 12.5px; }
  .player-mode .focus-note { font-size: 12.5px; }
  .player-mode .mandala-cell.elem .n { font-size: 12px; }
  .player-mode .mandala-cell.elem .p { font-size: 10.5px; }
  .player-mode .mandala-cell.action .a { font-size: 11px; }
  .player-mode .mandala-tap-hint { font-size: 11.5px; color: var(--blue-450); font-weight: 700; text-align: center; margin-bottom: 6px; }

  /* airlog list */
  .log-row { padding: 8px 0; border-top: 1px solid var(--gridline); display: flex; justify-content: space-between; gap: 8px; }
  .log-row:first-child { border-top: none; }
  .log-row .main { font-size: 13.5px; }
  .log-row .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .log-row .stat { font-size: 12px; color: var(--blue-550); font-weight: 700; white-space: nowrap; }

  /* notes thread */
  .note-bubble { max-width: 82%; padding: 8px 11px; border-radius: 13px; font-size: 13.5px; line-height: 1.5; margin-bottom: 6px; }
  .note-bubble.self { background: var(--blue-450); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .note-bubble.other { background: var(--page); color: var(--text-primary); margin-right: auto; border-bottom-left-radius: 4px; }
  .note-meta { font-size: 10px; color: var(--text-muted); margin: 2px 4px 8px; }

  .fatal { padding: 40px 24px; text-align: center; color: var(--text-secondary); font-size: 14.5px; line-height: 1.7; }
  .loading-line { padding: 10px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app-header">
  <p class="app-title">選手カルテ</p>
  <div class="segmented" id="selector" style="display:none;"></div>
  <div class="updated-row" id="updatedRow"></div>
</div>
<div class="app-body" id="app"></div>

<script>
/* ============================================================
   設定: Apps Scriptの /exec URL をここに入れる（デプロイ後に更新）
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbzOVS9w39ITWrjODvrDuKtUKieeSla-BaDeq1EoHmClTL2tpqC7_KbYw0BzSrvR6aDl/exec";

/* トランポリン技カタログ（自由入力も常に選択可） */
var SKILL_GROUPS = [
  { label: "基礎", skills: ["ストレートジャンプ", "タックジャンプ", "パイクジャンプ", "体側ジャンプ", "手決めジャンプ"] },
  { label: "姿勢移行", skills: ["シートドロップ", "フロントドロップ", "バックドロップ", "ヒザドロップ", "ハーフツイスト"] },
  { label: "宙返り", skills: ["バク宙(タック)", "バク宙(パイク)", "バク宙(ストレート)", "前宙(タック)", "前宙(パイク)", "前宙(ストレート)"] },
  { label: "ひねり", skills: ["バラーニ", "ルドルフ", "フルツイスト", "ダブルフロント", "ダブルバック"] },
  { label: "その他", skills: ["自由入力"] }
];

var VIEW_MODE = "coach"; // "player" = 本人専用トークンでアクセス / "coach" = トークン無し(保護者/コーチ用)
var ATHLETES = [];        // [{name, token}]
var current = null;       // 現在表示中の名前

var seasonCache = {};
var mandalaCache = {};
var stgCache = {};
var airlogCache = {};
var notesCache = {};
var taikaiCache = {};
var taikaiExpanded = {}; // name -> {idx: bool} 過去の大会振り返りの展開状態（コーチ用）

var airlogFormOpen = {};  // name -> bool
var airlogDraft = {};     // name -> {group, skill, custom, reps, success, memo, videoUrl}
var noteDraft = {};       // name -> テキスト
var fatalMessage = null;

var mandalaDrill = null;                    // 現在ドリルダウン中の要素名（nullなら全体表示）
var visionExpanded = { goal: false, ultimate: false }; // 将来ビジョンの各項目が開いているか
var aboutCardOpen = false; // 「競技について」カード自体が開いているか

// コーチ用ページのカード開閉状態（key -> bool）。コーチ・保護者は全項目を見たいが、
// 全部開いたままだと縦に長すぎるため、見出しタップで開閉する（2026-07-27）。
// 初期状態は「大会振り返り」のみ開き、他はすべて閉じる。本人ページは常時表示のままで開閉しない。
var COACH_CARD_DEFAULT_OPEN = { taikai: true };
var coachCardOpen = Object.assign({}, COACH_CARD_DEFAULT_OPEN);

function apiGet(type, token) {
  var url = API_URL + "?type=" + encodeURIComponent(type) + (token ? "&token=" + encodeURIComponent(token) : "");
  return fetch(url).then(function (r) { return r.json(); });
}
function apiListAthletes() {
  return fetch(API_URL + "?type=resolver&list=athletes").then(function (r) { return r.json(); });
}
function apiPost(payload) {
  return fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
}

function escHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tokenFor(name) {
  var a = ATHLETES.filter(function (x) { return x.name === name; })[0];
  return a ? a.token : null;
}

function fmtDate(d) {
  if (!d) return null;
  var dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return (dt.getMonth() + 1) + "/" + dt.getDate() + " " + ("0" + dt.getHours()).slice(-2) + ":" + ("0" + dt.getMinutes()).slice(-2);
}
// 大会日など、時刻を含めず日付だけを表示したいときに使う
function fmtDateOnly(d) {
  if (!d) return null;
  var dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return (dt.getMonth() + 1) + "/" + dt.getDate();
}

};
window.toggleCoachCard = function (key) {

  render();
};
window.selectMandalaElement = function (name) {

  render();
};

  taikaiExpanded[current][idx] = !taikaiExpanded[current][idx];
  render();
};
window.mandalaBack = function () {
  mandalaDrill = null;
  render();
};

window.toggleAirlogForm = function () {
  airlogFormOpen[current] = !airlogFormOpen[current];
  if (!airlogDraft[current]) airlogDraft[current] = { group: SKILL_GROUPS[0].label, skill: SKILL_GROUPS[0].skills[0], custom: "", reps: "", success: "", memo: "", videoUrl: "" };
  render();
};
window.setAirlogField = function (field, value) {
  if (!airlogDraft[current]) airlogDraft[current] = {};
  airlogDraft[current][field] = value;
  if (field === "group") {
    var g = SKILL_GROUPS.filter(function (x) { return x.label === value; })[0];
    airlogDraft[current].skill = g ? g.skills[0] : "";
  }
};
window.saveAirlogEntry = function () {
  var d = airlogDraft[current] || {};
  var technique = d.skill === "自由入力" ? (d.custom || "").trim() : d.skill;
  if (!technique) { alert("技名を入力してください"); return; }
  if (!d.reps) { alert("本数を入力してください"); return; }
  apiPost({ type: "addAirlog", token: tokenFor(current), technique: technique, reps: d.reps, success: d.success, memo: d.memo, videoUrl: d.videoUrl })
    .then(function (res) {
      if (res.error) { alert("保存に失敗しました: " + res.error); return; }
      delete airlogCache[current];
      airlogFormOpen[current] = false;
      loadAirlog(current);
      render();
    });
};

window.setNoteDraft = function (v) { noteDraft[current] = v; };
window.sendNote = function () {
  var text = (noteDraft[current] || "").trim();
  if (!text) return;
  var sender = VIEW_MODE === "player" ? "athlete" : "coach";
  apiPost({ type: "addCoachNote", token: tokenFor(current), sender: sender, text: text })
    .then(function (res) {
      if (res.error) { alert("送信に失敗しました: " + res.error); return; }
      noteDraft[current] = "";
      delete notesCache[current];
      loadNotes(current);
      render();
    });
};

// collapseKey を渡し、かつコーチ用ページのときだけ、見出しタップで開閉するカードにする。
// マークアップは既存の「競技について」カード（renderAboutCard）と同じ card-head clickable ＋ 右端の ▸／▾。
// 本人ページ（player）では collapseKey を渡しても常時表示のまま（毎日開いてすぐ目に入ることが目的のため）。
function cardWrap(tone, title, bodyHtml, collapseKey) {
  if (collapseKey && VIEW_MODE === "coach") {
    var open = !!coachCardOpen[collapseKey];
    return '<div class="card"><div class="card-head ' + tone + ' clickable" onclick="toggleCoachCard(\'' + collapseKey + '\')">' +
      '<span class="dot"></span><h2>' + escHtml(title) + '</h2>' +
      '<span class="chev" style="margin-left:auto;">' + (open ? "▾" : "▸") + '</span></div>' +
      (open ? '<div class="card-body">' + bodyHtml + '</div>' : '') +
      '</div>';
  }
  return '<div class="card"><div class="card-head ' + tone + '"><span class="dot"></span><h2>' + escHtml(title) + '</h2></div><div class="card-body">' + bodyHtml + '</div></div>';
}

// スコアに応じたバーの色（MICと同じ5段階配色）
var STEP_COLOR = { 1: "#86b6ef", 2: "#5598e7", 3: "#2a78d6", 4: "#1c5cab", 5: "#104281" };

// 自己分析（5段階評価）のバー表示。昨年度の回答があれば灰色マーカー・差分・凡例・改善ボックスを追加する。
// コーチ用カード（renderSeasonCard）・本人用カード（renderSelfAssessmentCard）の両方から呼ぶ共通部品。
function renderSelfRatingsBars(d) {
  var ratings = d.selfRatings || [];
  if (!ratings.length) return "";
  var topTwo = d.topTwo || [];
  var prevRatings = d.previousSelfRatings || null;
  var anyImproved = false;
  var improvedLabels = [];
  var barsHtml = ratings.map(function (r) {
    var score = r.score == null ? 0 : r.score;
    var isFocus = topTwo.indexOf(r.label) >= 0;
    var color = STEP_COLOR[score] || STEP_COLOR[1];
    var prevScore = null;
    if (prevRatings) {
      var pr = prevRatings.filter(function (x) { return x.label === r.label; })[0];
      if (pr && pr.score != null) prevScore = pr.score;
    }
    var markerHtml = "", diffHtml = "";
    if (prevScore != null && r.score != null) {
      markerHtml = '<div class="bar-prev-marker" style="left:' + (prevScore / 5 * 100) + '%;"></div>';
      var diff = r.score - prevScore;
      if (diff > 0) { anyImproved = true; improvedLabels.push(r.label); }
      var diffText = diff > 0 ? ("+" + diff + " ↑") : (diff === 0 ? "±0" : String(diff));
      diffHtml = '<span class="bar-diff ' + (diff > 0 ? "up" : "flat") + '">' + diffText + '</span>';
    }
    return '<div class="bar-row">' +
      '<div class="name">' + escHtml(r.label) + (isFocus ? '<span class="focus-chip">★</span>' : '') + '</div>' +
      '<div style="display:flex;align-items:center;gap:6px;">' +
      '<div class="bar-track" style="flex:1;">' +
      '<div class="bar-fill" style="width:' + (score / 5 * 100) + '%;background:' + color + ';"><span>' + (r.score == null ? "-" : r.score) + '</span></div>' +
      markerHtml +
      '</div>' + diffHtml +
      '</div></div>';
  }).join("");
  var focusNote = topTwo.length ? '<div class="focus-note"><span class="focus-chip">★</span> 今年特に伸ばしたい項目: ' + escHtml(topTwo.join("・")) + '</div>' : "";
  var legendHtml = prevRatings ? '<div class="self-legend"><span class="dot-marker"></span>昨年の自分。バーがこの印より右にあれば、伸びた分です。</div>' : "";
  var improveBoxHtml = (prevRatings && anyImproved)
    ? '<div class="self-improve-box">去年の自分とくらべて、' + escHtml(improvedLabels.join("・")) + 'が伸びました。去年つけた点数は消えません。来年の自分が、今年のこの印を追いこしていこう。</div>'
    : "";
  return '<div class="bars">' + barsHtml + '</div>' + focusNote + legendHtml + improveBoxHtml;
}

function seasonPlaceholder(c) {
  if (!c || c.status === "loading") return '<div class="mandala-empty">読み込み中…</div>';
  if (c.status === "error") return '<div class="mandala-empty">読み込みに失敗しました</div>';
  if (c.data && c.data.error) return '<div class="mandala-empty">' + escHtml(c.data.error) + '</div>';
  if (!c.data || !c.data.hasEntry) return '<div class="mandala-empty">まだシーズン目標が登録されていません</div>';
  return null;
}

// 目標ヒーロー（本人ページ限定・最上部）。既存のシーズン目標データから、カルテを開いた瞬間に
// 必ず目に入る「壁に貼った目標の紙」を作る。分析結果や課題はここには置かない。
// 「今年一番大切にしたい言葉」「自分へのメッセージ」は元々「生活習慣・サポート」カードの最下部に
// あったが、本人がほとんど目にしていなかったためこちらへ移動し、生活習慣カード側からは削除した。
function renderHero(name) {
  var c = seasonCache[name];
  if (!c || c.status === "loading") return "";
  if (c.status === "error" || !c.data || !c.data.hasEntry) return "";
  var d = c.data;
  var v = d.vision || {};
  var seiseki = (d.goals || {})["成績"];
  if (!v.goal && !v.ultimate && !seiseki && !d.importantWord && !d.finalMessage) return "";
  var html = '<div class="card hero-card">';
  if (v.goal) html += '<div class="hero-goal">' + escHtml(v.goal) + '</div>';
  if (v.ultimate) html += '<div class="hero-ultimate">' + escHtml(v.ultimate) + '</div>';
  if (seiseki) {
    html += '<div class="hero-divider"></div><div class="hero-season"><div class="k">今シーズンの目標成績</div><div class="v">' + escHtml(seiseki) + '</div></div>';
  }
  if (d.importantWord || d.finalMessage) {
    // ラベル（フォームの設問文と一致させる）は「今シーズンの目標成績」と同じ扱い＝小さめ・やや薄い色。
    // 値だけだと何の項目か分からない、というVanさんのフィードバックによる（2026-07-27）。
    html += '<div class="hero-message-box">' +
      (d.importantWord ? '<div class="hero-message-item"><div class="hero-message-k">今年一番大切にしたい言葉</div><div class="hero-message-line">' + escHtml(d.importantWord) + '</div></div>' : '') +
      (d.finalMessage ? '<div class="hero-message-item"><div class="hero-message-k">自分へのメッセージ</div><div class="hero-message-line">' + escHtml(d.finalMessage) + '</div></div>' : '') +
      '</div>';
  }
  html += '</div>';
  return html;
}

// 「競技について」カード：これまでフォームに回答があるのに画面に出ていなかった6項目
// （開始時期・きっかけ・好きなところ・尊敬する選手・強み・今の課題）を表示する（2026-07-25追加）
function renderAboutCard(name) {
  var c = seasonCache[name];
  var placeholder = seasonPlaceholder(c);
  var body;
  if (placeholder) body = placeholder;
  else {
    var a = c.data.about;
    if (!a) body = '<div class="mandala-empty">まだ回答がありません</div>';
    else {
      var ABOUT_LABELS = [
        ["startedWhen", "トランポリンを始めた時期"],
        ["reasonStarted", "始めたきっかけ"],
        ["favoritePart", "どんなところが好き？"],
        ["respectedAthlete", "尊敬している選手"],
        ["strength", "自分の強み"],
        ["challenge", "今、一番の課題"]
      ];
      body = ABOUT_LABELS.map(function (pair) {
        var key = pair[0], label = pair[1];
        if (!a[key]) return "";
        return '<div class="field"><div class="k">' + escHtml(label) + '</div><div class="v">' + escHtml(a[key]) + '</div></div>';
      }).join("");
    }
  }
  // カード自体をタップで開閉（普段は見出しのみ、タップで6項目がまとめて開く）
  var open = !!aboutCardOpen;
  return '<div class="card"><div class="card-head clickable" onclick="toggleAboutCard()">' +
    '<span class="dot"></span><h2>競技について</h2>' +
    '<span class="chev" style="margin-left:auto;">' + (open ? "▾" : "▸") + '</span></div>' +
    (open ? '<div class="card-body">' + body + '</div>' : '') +
    '</div>';
}

function renderSeasonCard(name) {
  var c = seasonCache[name];
  var placeholder = seasonPlaceholder(c);
  var body;
  if (placeholder) body = placeholder;
  else {
    var d = c.data;
    var GOAL_LABELS = { "成績": "今年達成したい大会成績", "技術": "今年伸ばしたい技術", "フィジカル": "今年伸ばしたい身体能力", "メンタル": "今年強くしたいこと", "学校生活": "学校で頑張りたいこと", "人間性": "競技以外で成長したいこと" };
    var goals = d.goals || {};
    var goalsHtml = '<div class="goal-grid">' + Object.keys(GOAL_LABELS).map(function (key) {
      var v = goals[key];
      var tile = v ? '<div class="goal-tile">' : '<div class="goal-tile muted">';
      return tile + '<div class="k">' + escHtml(GOAL_LABELS[key]) + '</div><div class="v">' + escHtml(v || "まだ回答がありません") + '</div></div>';

      ["来シーズン・自由演技", cp.nextSeasonFree]

  return cardWrap("", "今年のシーズン目標", body, "season");

// 本人ページ（player-mode）限定・新規: 大会振り返りの「よかったこと・うまくできたこと」だけを
// 全レコードから古い順に積み上げて表示する。このリストは減らない（大会を重ねるほど増える）ことが
// 本人ページに大会データを出す主目的。順位・点数・悔しかったことなどは一切出さない。
function renderAchievementsCard(name) {
  var tc = taikaiCache[name];
  var rowsHtml = "";
  if (!tc || tc.status === "loading") rowsHtml = '<div class="loading-line">読み込み中…</div>';
  else if (tc.status === "error") rowsHtml = "";
  else if (tc.data && tc.data.records && tc.data.records.length) {
    var items = tc.data.records
      .filter(function (r) { return r.kojin && r.kojin.goodThing; })
      .slice() // 破壊的sortを避ける
      .sort(function (a, b) { return new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime(); }); // 古い順
    rowsHtml = items.map(function (r) {
      var k = r.kojin;
      var meta = [r.meetName, fmtDateOnly(r.meetDate)].filter(Boolean).join("・");
      return '<div class="achieve-row">' +
        '<div class="achieve-main"><span class="achieve-check">✓</span><span class="achieve-text">' + escHtml(k.goodThing) + '</span></div>' +
        (k.goodReason ? '<div class="achieve-reason">' + escHtml(k.goodReason) + '</div>' : "") +
        (meta ? '<div class="achieve-meta">' + escHtml(meta) + '</div>' : "") +
        '</div>';
    }).join("");
  }
  var footer = '<div class="achieve-footer">大会が終わるたびに、できたことがここに増えていきます</div>';
  return cardWrap("green", "できるようになったこと", rowsHtml + footer, "achievements");
}

// コーチ用「大会振り返り」カード限定: 乖離アラートの判定。
// (1) 結果への満足度と演技内容への満足度の差が30以上、または
// (2) 大会の点数がシーズン目標の90%以上なのに、結果への満足度（自己採点）が50未満、のとき警告する。
function computeDiscrepancy(kojin, seasonGoalText) {
  if (!kojin) return null;
  var reasons = [];
  var result = kojin.resultScore, content = kojin.contentScore;
  if (result != null && content != null && Math.abs(result - content) >= 30) {
    reasons.push("結果への満足度（" + result + "点）と演技内容への満足度（" + content + "点）の差が大きい");
  }
  if (kojin.score != null && seasonGoalText) {
    var m = String(seasonGoalText).match(/(\d+(\.\d+)?)/);
    if (m) {
      var target = Number(m[1]);
      if (target > 0 && result != null) {
        var pct = kojin.score / target * 100;
        if (pct >= 90 && result < 50) {
          reasons.push("目標" + target + "点に対し" + kojin.score + "点（" + Math.round(pct) + "%）ながら、本人の自己採点は" + result + "点");
        }
      }
    }
  }
  return reasons.length ? reasons : null;
}

// コーチ用「大会振り返り」カードの1大会分の中身（最新の展開表示・過去分の折りたたみ展開の両方で使う）
// 順位の表記ゆれを「7位」に揃える。既存行は「7位」、フォーム経由の新規入力は数値のみ。
function fmtRank(v) {
  if (v === null || v === undefined || v === "") return null;
  var m = String(v).match(/\d+/);
  return m ? m[0] + "位" : String(v);
}

// 大会公式リザルトの得点内訳（E/D/H/T）の表示メタ情報。
// 分母を併記するのは満点が確認できているものだけ（E・H）。D と T は満点がないので、
// 代わりに「なぜ満点がないか」を一行添える。ここを誤ると本人が自分の点数を読み違える。
// 項目名は日本体操協会「トランポリン採点規則」の日本語表記に合わせる（規則18）。
//   D=難度得点／E=演技に対する得点／H=移動（Horizontal displacement）／
//   T=跳躍時間に対する得点／S=同時性に対する得点
// 話し言葉の言い換え（「演技のきれいさ」等）は、本人ページ・コーチ用とも出さない（2026-07-29 Vanさん指示）。
var SCORE_PARTS = [
  { key: "E", label: "演技点", maxKey: "EMax" },
  { key: "D", label: "難度点", note: "満点なし。むずかしい技を入れるほど上がります" },
  { key: "H", label: "水平移動点", maxKey: "HMax" },
  { key: "T", label: "跳躍時間点", note: "満点なし。1秒が1点です" },
  { key: "synchro", label: "同時性点", maxKey: "synchroMax" }
];

// 得点内訳のタイル群。値が入っている項目だけを出す（空欄は「未回答／未入力」として静かに畳む）。
function renderScoreTiles(o) {
  var tiles = SCORE_PARTS.map(function (p) {
    var v = o[p.key];
    if (v === null || v === undefined || v === "") return "";
    var maxHtml = (p.maxKey && o[p.maxKey] != null) ? '<span class="score-max"> / ' + escHtml(o[p.maxKey]) + '</span>' : "";
    return '<div class="score-tile">' +
      '<div class="score-head"><span class="score-sym">' + escHtml(p.key === "synchro" ? "S" : p.key) + '</span>' + escHtml(p.label) + '</div>' +
      '<div class="score-val">' + escHtml(v) + maxHtml + '</div>' +
      (p.note ? '<div class="score-note">' + escHtml(p.note) + '</div>' : "") +
      '</div>';
  }).join("");
  return tiles ? '<div class="score-grid">' + tiles + '</div>' : "";
}

// 本人ページ限定・新規: 大会公式リザルトの得点内訳（個人競技のみ）。
// 順位・総得点は出さない（実装指示書§2-6のとおり）。内訳だけを出すのは2026-07-27の決定による。
// シンクロを出さないのは、個人E満点20・シンクロE満点10と満点が異なり、並べると
// 16.4が7.85に落ちたと誤読される余地が残るため（コーチ用には出す）。
function renderScoreBreakdownCard(name) {
  var tc = taikaiCache[name];
  if (!tc || tc.status !== "loaded" || !tc.data || !tc.data.records) return "";
  // 得点内訳のある大会を新しい順に探す（大会ごとの行として持っているので、
  // 推移表示に切り替えるときはこの絞り込みを外して描画を変えるだけで済む）。
  var rec = null, kojinRows = null;
  for (var i = 0; i < tc.data.records.length; i++) {
    var rows = (tc.data.records[i].official || []).filter(function (x) { return x.event !== "シンクロ"; });
    if (rows.length) { rec = tc.data.records[i]; kojinRows = rows; break; }
  }
  if (!kojinRows) return "";
  // 該当する個人の行は「決勝だけ」などと決め打ちせず、予選・決勝ともそのまま並べる。
  // 予選と決勝が別日開催の大会があるので、日付はラウンドごとに出す。
  var blocks = kojinRows.map(function (o, idx) {
    var meta = [rec.meetName, fmtDateOnly(o.meetDate) || fmtDateOnly(rec.meetDate), o.round].filter(Boolean).join("・");
    return '<div' + (idx > 0 ? ' class="score-round-gap"' : '') + '>' +
      (meta ? '<div class="score-meta">' + escHtml(meta) + '</div>' : "") +
      renderScoreTiles(o) + '</div>';
  }).join("");
  var body = blocks +
    '<div class="score-legend">大会の点数は、この4つを合計したものです。きれいさとむずかしさは、べつべつに点がつきます。1つの数字ではなく、どこが伸びたかで見ていこう。</div>';
  return cardWrap("", "大会の得点の中身", body);
}

function renderTaikaiRecordBody(r, seasonGoalText) {
  var kojin = r.kojin, sync = r.sync;
  var tiles = "";
  if (kojin) {
    tiles += '<div class="goal-tile"><div class="k">個人・順位/点数</div><div class="v">' + escHtml(fmtRank(kojin.rank) || "-") + " / " + escHtml(kojin.score != null ? kojin.score : "-") + '</div></div>';
    tiles += '<div class="goal-tile"><div class="k">結果への満足度</div><div class="v">' + escHtml(kojin.resultScore != null ? kojin.resultScore + "点" : "-") + '</div></div>';
    tiles += '<div class="goal-tile"><div class="k">演技内容への満足度</div><div class="v">' + escHtml(kojin.contentScore != null ? kojin.contentScore + "点" : "-") + '</div></div>';
  }
  if (sync) {
    tiles += '<div class="goal-tile"><div class="k">シンクロ・順位/点数</div><div class="v">' + escHtml(fmtRank(sync.rank) || "-") + " / " + escHtml(sync.score != null ? sync.score : "-") + '</div></div>';
  }
  var tilesHtml = tiles ? '<div class="goal-grid">' + tiles + '</div>' : "";

  var discrepancy = computeDiscrepancy(kojin, seasonGoalText);
  var alertHtml = discrepancy ? '<div class="taikai-alert">' + escHtml(discrepancy.join("。") + "。結果と自己評価が大きく離れています。") + '</div>' : "";

  // 大会公式リザルト（sporttech.io からの転記）。個人・シンクロとも出す。
  // 本人ページは個人のみだが、コーチは満点差（個人E20点・シンクロE10点）を理解したうえで
  // 読めるので、シンクロの内訳もここに出し、本人に伝えるかどうかはコーチが判断する。
  var officialRows = r.official || [];
  var officialHtml = officialRows.length ? officialRows.map(function (o) {
    var head = [o.event, o.round, fmtDateOnly(o.meetDate)].filter(Boolean).join("・");
    var totalBits = [];
    if (o.rank != null) totalBits.push(fmtRank(o.rank));
    if (o.total != null) totalBits.push(o.total + "点");
    return '<div class="official-block">' +
      '<div class="official-head">公式リザルト' + (head ? "（" + escHtml(head) + "）" : "") +
      (totalBits.length ? '<span class="official-total">' + escHtml(totalBits.join(" / ")) + '</span>' : "") + '</div>' +
      renderScoreTiles(o) +
      // 満点は「1種目あたりの満点 × 有効種目数」で出している（CoP §15.4）。10種目でないときと、
      // S1〜S10から検算できず分母を伏せたときは、その理由をコーチに明示する。
      (o.elements != null && o.elements !== 10 && o.maxVerified
        ? '<div class="score-note">有効種目数 ' + escHtml(o.elements) + '（10種目に満たないため、E・H・S の満点も種目数に応じて下がっています）</div>' : "") +
      (o.E != null && o.EMax == null
        ? '<div class="score-note">満点は未確定（S1〜S10とLからE を検算できなかったため、分母を伏せています）</div>' : "") +
      (o.L != null ? '<div class="score-note">L ' + escHtml(o.L) + '（実施減点の一部。すでにEに含まれているため総得点から別途引かない）</div>' : "") +
      (o.sourceUrl ? '<div class="score-note"><a class="mandala-link" href="' + escHtml(o.sourceUrl) + '" target="_blank" rel="noopener">公式記録を開く →</a></div>' : "") +
      '</div>';
  }).join("")
  // 名前＋大会名で一致する行がないときは、黙って消さずに未登録であることを明示する
  // （空欄なのか転記漏れなのかがコーチ画面で区別できなくなるため）。
  : '<div class="official-block"><div class="official-head">公式リザルト</div>' +
    '<div class="mandala-empty">公式リザルト未登録（大会公式リザルトタブに、この大会名の行がありません）</div></div>';

  var fields = [];
  if (kojin) {
    if (kojin.goalAchieved) fields.push(["大会前の目標の達成度", kojin.goalAchieved]);
    if (kojin.scoreFocus) fields.push(["自己採点で一番気になった観点", kojin.scoreFocus]);
    if (kojin.mainIssue) fields.push(["一番の課題（本人の見立て）", kojin.mainIssue]);
    if (kojin.feeling) fields.push(["演技はどうだった", kojin.feeling]);
    if (kojin.improve) fields.push(["悔しかったこと・改善したいこと", kojin.improve]);
    if (kojin.scoreReason) fields.push(["点数の理由", kojin.scoreReason]);
    if (kojin.coachHelp) fields.push(["コーチに手伝ってほしいこと", kojin.coachHelp]);
    if (kojin.painFear && kojin.painFear !== "なかった") fields.push(["痛み・怖さ・困ったこと", kojin.painFearDetail || kojin.painFear]);
  }
  if (sync) {
    if (sync.timing) fields.push(["ペアとのタイミング", sync.timing]);
    if (sync.timingCause) fields.push(["ずれた原因", sync.timingCause]);
  }
  var fieldsHtml = fields.map(function (p) {
    return '<div class="field"><div class="k">' + escHtml(p[0]) + '</div><div class="v">' + escHtml(p[1]) + '</div></div>';
  }).join("");

  var shownToPlayer = [];
  if (kojin && kojin.goodThing) shownToPlayer.push("できたこと: " + kojin.goodThing);
  if (kojin && kojin.practicePlan) shownToPlayer.push("練習: " + kojin.practicePlan);
  if (r.common && r.common.nextFunText) shownToPlayer.push("楽しみ: " + r.common.nextFunText);
  if (r.common && r.common.selfWord) shownToPlayer.push("ひとこと: " + r.common.selfWord);
  var footerHtml = shownToPlayer.length
    ? '<div class="taikai-footer"><div class="k">本人ページにも出している言葉</div>' + escHtml(shownToPlayer.join(" / ")) + '</div>'
    : "";

  return tilesHtml + alertHtml + officialHtml + fieldsHtml + footerHtml;
}

// 9x9の生シート(MICのマンダラチャート(記入用)と同じレイアウト)を、中心目標+8要素(各8アクション)の
// 構造にクライアント側でパースする。中心ブロック(行3-5・列3-5)の中心=中心目標、その周囲8マスが
// 8要素の名前。各要素名は、その要素に対応するブロック(周囲8ブロックのいずれか)の中心マスにも
// 同じ文言で入っている想定(MIC標準のマンダラート様式)ので、そのブロックの残り8マスを行動リストとする。
function parseMandala9x9(grid) {
  if (!grid) return null;
  var centerGoal = grid[4][4];
  if (!centerGoal) return null;
  var rel = [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]];
  var elements = rel.map(function (p) {
    var name = grid[3 + p[0]][3 + p[1]];
    if (!name) return null;
    var actions = rel.map(function (p2) {
      var v = grid[p[0] * 3 + p2[0]][p[1] * 3 + p2[1]];
      return v || null;
    });
    return { name: name, actions: actions };
  });
  return { goal: centerGoal, elements: elements };
}

function countDone(actions) {
  return actions ? actions.filter(Boolean).length : 0;
}

function renderMandalaCard(name, playerMode) {
  var c = mandalaCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="mandala-empty">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="mandala-empty">読み込みに失敗しました</div>';
  else {
    var d = c.data;
    if (d.error) body = '<div class="mandala-empty">' + escHtml(d.error) + '</div>' +
      (d.editUrl ? '<div class="mandala-summary"><span></span><a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">シートを開く →</a></div>' : "");
    else {
      var m = parseMandala9x9(d.grid);
      if (!m) {
        body = '<div class="mandala-empty">まだ着手前です。「マンダラチャート(記入用)」シートの中心マス(目標)から書き始めてもらいましょう。</div>' +
          (d.editUrl ? '<div class="mandala-summary"><span></span><a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">シートを開く →</a></div>' : "");
      } else {
        var drillEl = mandalaDrill ? m.elements.filter(function (el) { return el && el.name === mandalaDrill; })[0] : null;
        if (drillEl) {
          var actions = drillEl.actions || [];
          var cells9 = [actions[0], actions[1], actions[2], actions[3], "__CENTER__", actions[4], actions[5], actions[6], actions[7]];
          var emptyLabel = playerMode ? "これから考える" : "未記入";
          var cellsHtml = cells9.map(function (v) {
            if (v === "__CENTER__") return '<div class="mandala-cell center sub"><div class="g">' + escHtml(drillEl.name) + '</div></div>';
            if (v) return '<div class="mandala-cell action filled"><div class="a">' + escHtml(v) + '</div></div>';
            return '<div class="mandala-cell action"><div class="a muted">（' + emptyLabel + '）</div></div>';
          }).join("");
          var drillCount = countDone(drillEl.actions);
          var drillLabel = playerMode ? (drillCount + '個できた') : (drillCount + '/8 記入済み');
          body = '<div class="mandala-summary" style="margin-top:0;margin-bottom:8px;">' +
            '<a class="mandala-link" href="javascript:void(0)" onclick="mandalaBack()">← 全体に戻る</a><span>' + drillLabel + '</span></div>' +
            '<div class="mandala-3x3">' + cellsHtml + '</div>' +
            '<div class="mandala-summary"><span></span>' + (d.editUrl ? '<a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">シートで編集する →</a>' : '') + '</div>';
        } else {
          var doneTotal = 0, cellTotal = 0;
          var cellsHtml2 = m.elements.map(function (el) {
            if (!el) return '<div class="mandala-cell center"><div class="g">' + escHtml(m.goal) + '</div></div>';
            var done = countDone(el.actions);
            doneTotal += done; cellTotal += 8;
            var started = done > 0;
            var pLabel = playerMode ? (started ? done + "個できた" : "これから考える") : (done + '/8' + (started ? '' : '・未着手'));
            return '<div class="mandala-cell elem clickable' + (started ? ' started' : '') + '" onclick="selectMandalaElement(\'' + escHtml(el.name).replace(/'/g, "\\'") + '\')">' +
              '<div class="n">' + escHtml(el.name) + '</div><div class="p">' + pLabel + '</div></div>';
          });
          // 要素の並びは中心マスの位置(4番目)に中心目標を差し込む
          cellsHtml2.splice(4, 0, '<div class="mandala-cell center"><div class="g">' + escHtml(m.goal) + '</div></div>');
          var tapHint = playerMode ? '<div class="mandala-tap-hint">👉 8つのマスをタップすると、それぞれの行動を見られるよ</div>' : "";
          var bottomHint = playerMode ? "" : '<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;text-align:center;">各要素をタップすると、その8マスの内容を見られます</div>';
          body = tapHint + '<div class="mandala-3x3">' + cellsHtml2.join("") + '</div>' +
            '<div class="mandala-summary"><span>行動レベル ' + doneTotal + '/' + cellTotal + 'マス記入済み' + (d.updatedAt ? '・更新日 ' + escHtml(fmtDate(d.updatedAt)) : '') + '</span>' +
            (d.editUrl ? '<a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">全81マスを見る →</a>' : '') + '</div>' +
            bottomHint;
        }
      }
    }
  }
  return cardWrap("gold", "マンダラチャート", body, "mandala");
}

function renderStgCard(name) {
  var c = stgCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var d = c.data;
    if (!d.entry) body = '<div class="muted">まだ回答がありません</div>';
    else {
      var e = d.entry;
      body =
        (e.timestamp ? '<div class="field"><div class="k">記入日</div><div class="v">' + escHtml(fmtDate(e.timestamp)) + '</div></div>' : '') +
        (e.reflection ? '<div class="field"><div class="k">前回の振り返り</div><div class="v">' + escHtml(e.reflection) + '</div></div>' : '') +
        (e.newGoal ? '<div class="field"><div class="k">新しい目標</div><div class="v">' + escHtml(e.newGoal) + '</div></div>' : '') +
        (e.wantToTry ? '<div class="field"><div class="k">挑戦したい技</div><div class="v">' + escHtml(e.wantToTry) + '</div></div>' : '');
    }
  }
  return cardWrap("", "短期目標（月次振り返り）", body, "stg");
}

function renderAirlogCard(name) {
  var c = airlogCache[name];
  var listHtml;
  if (!c || c.status === "loading") listHtml = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") listHtml = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var records = (c.data && c.data.records) || [];
    if (!records.length) listHtml = '<div class="muted">まだ記録がありません</div>';
    else {
      listHtml = records.slice(0, 15).map(function (r) {
        var rate = (r.reps && r.success) ? Math.round((r.success / r.reps) * 100) + "%" : "";
        return '<div class="log-row"><div><div class="main">' + escHtml(r.technique) + '</div><div class="sub">' + escHtml(fmtDate(r.timestamp)) + (r.memo ? " ・ " + escHtml(r.memo) : "") + '</div></div><div class="stat">' + escHtml(r.success || "-") + '/' + escHtml(r.reps || "-") + (rate ? ' <span class="muted">' + rate + '</span>' : '') + '</div></div>';
      }).join("");
    }
  }
  var open = !!airlogFormOpen[name];
  var draft = airlogDraft[name] || { group: SKILL_GROUPS[0].label, skill: SKILL_GROUPS[0].skills[0] };
  var formHtml = "";
  if (open) {
    var groupOpts = SKILL_GROUPS.map(function (g) {
      return '<option value="' + escHtml(g.label) + '"' + (g.label === draft.group ? " selected" : "") + '>' + escHtml(g.label) + '</option>';
    }).join("");
    var curGroup = SKILL_GROUPS.filter(function (g) { return g.label === draft.group; })[0] || SKILL_GROUPS[0];
    var skillOpts = curGroup.skills.map(function (s) {
      return '<option value="' + escHtml(s) + '"' + (s === draft.skill ? " selected" : "") + '>' + escHtml(s) + '</option>';
    }).join("");
    formHtml =
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--gridline);">' +
      '<label class="lbl">技の分類</label><select onchange="setAirlogField(\'group\', this.value); render()">' + groupOpts + '</select>' +
      '<label class="lbl">技</label><select onchange="setAirlogField(\'skill\', this.value); render()">' + skillOpts + '</select>' +
      (draft.skill === "自由入力" ? '<label class="lbl">技名（自由入力）</label><input type="text" value="' + escHtml(draft.custom || "") + '" oninput="setAirlogField(\'custom\', this.value)">' : "") +
      '<label class="lbl">本数</label><input type="number" value="' + escHtml(draft.reps || "") + '" oninput="setAirlogField(\'reps\', this.value)">' +
      '<label class="lbl">成功数（かかり）</label><input type="number" value="' + escHtml(draft.success || "") + '" oninput="setAirlogField(\'success\', this.value)">' +
      '<label class="lbl">メモ</label><textarea oninput="setAirlogField(\'memo\', this.value)">' + escHtml(draft.memo || "") + '</textarea>' +
      '<label class="lbl">動画URL（任意）</label><input type="url" value="' + escHtml(draft.videoUrl || "") + '" oninput="setAirlogField(\'videoUrl\', this.value)">' +
      '<div class="btn-row"><button class="btn btn-primary" onclick="saveAirlogEntry()">保存</button><button class="btn btn-ghost" onclick="toggleAirlogForm()">キャンセル</button></div>' +
      '</div>';
  }
  var toggleBtn = '<div class="btn-row"><button class="btn ' + (open ? "btn-ghost" : "btn-primary") + '" onclick="toggleAirlogForm()">' + (open ? "閉じる" : "＋ 記録を追加") + '</button></div>';
  return cardWrap("green", "技・ジャンプ記録ログ", listHtml + toggleBtn + formHtml, "airlog");
}

function renderNotesCard(name) {
  var c = notesCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var notes = (c.data && c.data.notes) || [];
    var selfLabel = VIEW_MODE === "player" ? "本人" : "コーチ";
    var thread = notes.length
      ? notes.map(function (n) {
          var mine = n.sender === selfLabel;
          return '<div class="note-bubble ' + (mine ? "self" : "other") + '">' + escHtml(n.text) + '</div><div class="note-meta" style="text-align:' + (mine ? "right" : "left") + '">' + escHtml(n.sender) + " ・ " + escHtml(fmtDate(n.timestamp)) + '</div>';
        }).join("")
      : '<div class="muted">まだメッセージがありません</div>';
    body = thread +
      '<div style="margin-top:10px;"><textarea placeholder="メッセージを入力…" oninput="setNoteDraft(this.value)">' + escHtml(noteDraft[name] || "") + '</textarea>' +
      '<div class="btn-row"><button class="btn btn-primary" onclick="sendNote()">送信</button></div></div>';
  }
  return cardWrap("", "コーチへ共有メモ", body, "notes");
}

/* ---------------- 全体描画 ---------------- */

function renderSelector() {
  var el = document.getElementById("selector");
  if (VIEW_MODE !== "coach" || ATHLETES.length < 2) { el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = ATHLETES.map(function (a) {
    return '<button class="' + (a.name === current ? "active" : "") + '" onclick="selectAthlete(\'' + a.name + '\')">' + escHtml(a.name) + '</button>';
  }).join("");
}

function render() {
  renderSelector();
  var app = document.getElementById("app");
  if (fatalMessage) { app.innerHTML = '<div class="fatal">' + escHtml(fatalMessage) + '</div>'; return; }
  if (!current) { app.innerHTML = '<div class="loading-line">読み込み中…</div>'; return; }

  var updatedRow = document.getElementById("updatedRow");
  if (updatedRow) {
    loadSeason(current); // 既に読み込み中/済みなら何もしない
    var sc = seasonCache[current];
    var seasonUpdated = (sc && sc.status === "loaded" && sc.data.hasEntry) ? fmtDate(sc.data.timestamp) : null;
    updatedRow.textContent = "中長期目標 更新日: " + (seasonUpdated || "まだ回答がありません");
  }

  if (VIEW_MODE === "player") {
    // 本人ページ: 最上部に目標ヒーロー、続いて「今、大事にしたいこと」（練習中のことを追加）、
    // 「できるようになったこと」（大会振り返りの前向きな情報のみ）、シーズン目標は目標／自己分析
    // （昨年比つき）の2枚に分割、「次の大会や練習で楽しみなこと」を小さく追加。
    // 大会の順位・点数・満足度・悔しかったこと等は一切出さない（本人ページに出さないものの一覧は
    // 選手カルテ_大会振り返り反映_実装指示書の「2-6」参照）。
    app.innerHTML =
      renderHero(current) +
      renderFocusCard(current) +
      renderAchievementsCard(current) +
      renderScoreBreakdownCard(current) +
      renderAboutCard(current) +
      renderVisionCard(current) +
      renderGoalsCard(current) +
      renderSelfAssessmentCard(current) +
      renderNextFunCard(current) +
      renderMandalaCard(current, true) +
      renderStgCard(current) +
      renderAirlogCard(current) +
      renderNotesCard(current) +
      renderLifeSupportCard(current);
  } else {
    // コーチ用一覧: コーチ・保護者は全項目を見たいので、本人ページにしか出していなかった
    // 「できるようになったこと」「次の大会や練習で楽しみなこと」もここに出す。ただし全部開いたままだと
    // 縦に長すぎるため、見出しタップで開閉する（開くのは初期状態で「大会振り返り」のみ）。
    // 「競技について」カードは、フォームには回答があるのに画面に一切出ていなかった項目のため、
    // コーチ/本人ビュー分岐の対象ではなく単純な表示漏れの修正として両ビューに追加済み。
    app.innerHTML =
      renderTaikaiCard(current) +
      renderAchievementsCard(current) +
      renderAboutCard(current) +
      renderVisionCard(current) +
      renderSeasonCard(current) +
      renderNextFunCard(current) +
      renderMandalaCard(current, false) +
      renderStgCard(current) +
      renderAirlogCard(current) +
      renderNotesCard(current) +
      renderLifeSupportCard(current);
  }
}

/* ---------------- 起動 ---------------- */

function renderFatal(msg) { fatalMessage = msg; render(); }

async function initApp() {
  var urlToken = new URLSearchParams(location.search).get("token");
  try {
    if (urlToken) {
      var res = await apiGet("resolver", urlToken);
      if (res.error) { renderFatal("このリンクは無効です。お手数ですが保護者にご確認ください。"); return; }
      VIEW_MODE = "player";
      document.body.classList.add("player-mode");
      ATHLETES = [{ name: res.name, token: urlToken }];
      current = res.name;
      document.querySelector(".app-title").textContent = res.name + " の選手カルテ";
    } else {
      VIEW_MODE = "coach";
      var listRes = await apiListAthletes();
      if (!listRes.athletes || !listRes.athletes.length) { renderFatal("選手データを取得できませんでした。しばらくしてから再度お試しください。"); return; }
      ATHLETES = listRes.athletes;
      current = ATHLETES[0].name;
    }
    render();
    loadAllFor(current);
  } catch (err) {
    renderFatal("データの取得に失敗しました。時間をおいて再度お試しください（" + err + "）。");
  }
}

initApp();
</script>
</body>
</html>
