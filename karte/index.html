<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瑛斗・颯斗 選手カルテ</title>
<style>
  :root {
    --surface-1: #ffffff;
    --page: #f4f5f7;
    --text-primary: #0b0b0b;
    --text-secondary: #55575c;
    --text-muted: #8a8d93;
    --gridline: #e7e8ec;
    --border: rgba(11,11,11,0.08);
    --blue-450: #2a78d6;
    --blue-250: #86b6ef;
    --blue-550: #1c5cab;
    --accent-soft: #eaf2fc;
    --gold-soft: #fbf3df;
    --gold-line: #d79b00;
    --gold-text: #8a6400;
    --green-soft: #eaf7ef;
    --green-line: #1f9d55;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  .app-title { font-size: 17px; font-weight: 700; text-align: center; margin: 0 0 10px; }
  .segmented { display: flex; background: var(--page); border-radius: 10px; padding: 3px; gap: 2px; }
  .segmented button {
    flex: 1; border: none; background: transparent; padding: 8px 6px; font-size: 14px;
    font-weight: 600; color: var(--text-secondary); border-radius: 8px; font-family: inherit;
  }
  .segmented button.active { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 3px rgba(11,11,11,0.12); }
  .app-body { padding: 12px 12px calc(var(--safe-bottom) + 28px); max-width: 480px; margin: 0 auto; }
  .card { background: var(--surface-1); border-radius: 14px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(11,11,11,0.05); border: 1px solid var(--border); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .card-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-450); flex: none; }
  .card-head.gold .dot { background: var(--gold-line); }
  .card-head.green .dot { background: var(--green-line); }
  .card-head h2 { font-size: 13.5px; font-weight: 700; margin: 0; color: var(--text-secondary); letter-spacing: 0.02em; }
  .card-body { padding: 0 14px 14px; }
  .field { padding: 8px 0; border-top: 1px solid var(--gridline); }
  .field:first-child { border-top: none; padding-top: 0; }
  .field .k { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .field .v { font-size: 14px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .btn { display: inline-block; border: none; border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .btn-primary { background: var(--blue-450); color: #fff; }
  .btn-ghost { background: var(--page); color: var(--text-secondary); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text], input[type=number], input[type=url], textarea, select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page); margin-top: 4px; box-sizing: border-box;
  }
  textarea { min-height: 60px; resize: vertical; }
  label.lbl { font-size: 11.5px; color: var(--text-muted); display: block; margin-top: 10px; }
  label.lbl:first-child { margin-top: 0; }

  /* mandala (9x9 live grid, MIC方式) */
  .mandala-grid9 { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: var(--gridline); border: 1px solid var(--gridline); border-radius: 8px; overflow: hidden; }
  .mandala-cell9 {
    background: var(--surface-1); padding: 4px 2px; min-height: 40px;
    font-size: 8.5px; line-height: 1.2; display: flex; align-items: center; justify-content: center;
    text-align: center; word-break: break-all;
  }
  .mandala-cell9.center-goal { background: var(--gold-soft); font-weight: 700; color: var(--gold-text); font-size: 9px; }
  .mandala-cell9.block-center { background: var(--accent-soft); font-weight: 700; color: var(--blue-550); }
  .mandala-cell9.empty { color: var(--text-muted); }
  .mandala-link { font-size: 12.5px; color: var(--blue-450); font-weight: 700; margin-top: 10px; display: inline-block; }
  .rating-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--gridline); font-size: 13px; }
  .rating-row:first-child { border-top: none; }
  .rating-row .rn { color: var(--text-secondary); }
  .rating-row .rv { font-weight: 700; color: var(--blue-550); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: var(--accent-soft); color: var(--blue-550); font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .subhead { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 0 4px; }
  .subhead:first-child { margin-top: 0; }

  /* airlog list */
  .log-row { padding: 8px 0; border-top: 1px solid var(--gridline); display: flex; justify-content: space-between; gap: 8px; }
  .log-row:first-child { border-top: none; }
  .log-row .main { font-size: 13.5px; }
  .log-row .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .log-row .stat { font-size: 12px; color: var(--blue-550); font-weight: 700; white-space: nowrap; }

  /* notes thread */
  .note-bubble { max-width: 82%; padding: 8px 11px; border-radius: 13px; font-size: 13.5px; line-height: 1.5; margin-bottom: 6px; }
  .note-bubble.self { background: var(--blue-450); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .note-bubble.other { background: var(--page); color: var(--text-primary); margin-right: auto; border-bottom-left-radius: 4px; }
  .note-meta { font-size: 10px; color: var(--text-muted); margin: 2px 4px 8px; }

  .fatal { padding: 40px 24px; text-align: center; color: var(--text-secondary); font-size: 14.5px; line-height: 1.7; }
  .loading-line { padding: 10px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app-header">
  <p class="app-title">選手カルテ</p>
  <div class="segmented" id="selector" style="display:none;"></div>
</div>
<div class="app-body" id="app"></div>

<script>
/* ============================================================
   設定: Apps Scriptの /exec URL をここに入れる（デプロイ後に更新）
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbzOVS9w39ITWrjODvrDuKtUKieeSla-BaDeq1EoHmClTL2tpqC7_KbYw0BzSrvR6aDl/exec";

/* トランポリン技カタログ（自由入力も常に選択可） */
var SKILL_GROUPS = [
  { label: "基礎", skills: ["ストレートジャンプ", "タックジャンプ", "パイクジャンプ", "体側ジャンプ", "手決めジャンプ"] },
  { label: "姿勢移行", skills: ["シートドロップ", "フロントドロップ", "バックドロップ", "ヒザドロップ", "ハーフツイスト"] },
  { label: "宙返り", skills: ["バク宙(タック)", "バク宙(パイク)", "バク宙(ストレート)", "前宙(タック)", "前宙(パイク)", "前宙(ストレート)"] },
  { label: "ひねり", skills: ["バラーニ", "ルドルフ", "フルツイスト", "ダブルフロント", "ダブルバック"] },
  { label: "その他", skills: ["自由入力"] }
];

var VIEW_MODE = "coach"; // "player" = 本人専用トークンでアクセス / "coach" = トークン無し(保護者/コーチ用)
var ATHLETES = [];        // [{name, token}]
var current = null;       // 現在表示中の名前

var seasonCache = {};
var mandalaCache = {};
var stgCache = {};
var airlogCache = {};
var notesCache = {};

var airlogFormOpen = {};  // name -> bool
var airlogDraft = {};     // name -> {group, skill, custom, reps, success, memo, videoUrl}
var noteDraft = {};       // name -> テキスト
var fatalMessage = null;

function apiGet(type, token) {
  var url = API_URL + "?type=" + encodeURIComponent(type) + (token ? "&token=" + encodeURIComponent(token) : "");
  return fetch(url).then(function (r) { return r.json(); });
}
function apiListAthletes() {
  return fetch(API_URL + "?type=resolver&list=athletes").then(function (r) { return r.json(); });
}
function apiPost(payload) {
  return fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
}

function escHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tokenFor(name) {
  var a = ATHLETES.filter(function (x) { return x.name === name; })[0];
  return a ? a.token : null;
}

function fmtDate(d) {
  if (!d) return null;
  var dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return (dt.getMonth() + 1) + "/" + dt.getDate() + " " + ("0" + dt.getHours()).slice(-2) + ":" + ("0" + dt.getMinutes()).slice(-2);
}

/* ---------------- データ読み込み ---------------- */

function loadSeason(name) {
  if (seasonCache[name]) return;
  seasonCache[name] = { status: "loading" };
  apiGet("season", tokenFor(name)).then(function (d) {
    seasonCache[name] = { status: "loaded", data: d }; render();
  }).catch(function (err) { seasonCache[name] = { status: "error", error: String(err) }; render(); });
}
function loadMandala(name) {
  if (mandalaCache[name]) return;
  mandalaCache[name] = { status: "loading" };
  apiGet("mandala", tokenFor(name)).then(function (d) {
    mandalaCache[name] = { status: "loaded", data: d }; render();
  }).catch(function (err) { mandalaCache[name] = { status: "error", error: String(err) }; render(); });
}
function loadStg(name) {
  if (stgCache[name]) return;
  stgCache[name] = { status: "loading" };
  apiGet("stg", tokenFor(name)).then(function (d) {
    stgCache[name] = { status: "loaded", data: d }; render();
  }).catch(function (err) { stgCache[name] = { status: "error", error: String(err) }; render(); });
}
function loadAirlog(name) {
  if (airlogCache[name]) return;
  airlogCache[name] = { status: "loading" };
  apiGet("airlog", tokenFor(name)).then(function (d) {
    airlogCache[name] = { status: "loaded", data: d }; render();
  }).catch(function (err) { airlogCache[name] = { status: "error", error: String(err) }; render(); });
}
function loadNotes(name) {
  if (notesCache[name]) return;
  notesCache[name] = { status: "loading" };
  apiGet("coachnotes", tokenFor(name)).then(function (d) {
    notesCache[name] = { status: "loaded", data: d }; render();
  }).catch(function (err) { notesCache[name] = { status: "error", error: String(err) }; render(); });
}
function loadAllFor(name) {
  loadSeason(name); loadMandala(name); loadStg(name); loadAirlog(name); loadNotes(name);
}

/* ---------------- 操作系 ---------------- */

window.selectAthlete = function (name) {
  current = name;
  render();
  loadAllFor(name);
};

window.toggleAirlogForm = function () {
  airlogFormOpen[current] = !airlogFormOpen[current];
  if (!airlogDraft[current]) airlogDraft[current] = { group: SKILL_GROUPS[0].label, skill: SKILL_GROUPS[0].skills[0], custom: "", reps: "", success: "", memo: "", videoUrl: "" };
  render();
};
window.setAirlogField = function (field, value) {
  if (!airlogDraft[current]) airlogDraft[current] = {};
  airlogDraft[current][field] = value;
  if (field === "group") {
    var g = SKILL_GROUPS.filter(function (x) { return x.label === value; })[0];
    airlogDraft[current].skill = g ? g.skills[0] : "";
  }
};
window.saveAirlogEntry = function () {
  var d = airlogDraft[current] || {};
  var technique = d.skill === "自由入力" ? (d.custom || "").trim() : d.skill;
  if (!technique) { alert("技名を入力してください"); return; }
  if (!d.reps) { alert("本数を入力してください"); return; }
  apiPost({ type: "addAirlog", token: tokenFor(current), technique: technique, reps: d.reps, success: d.success, memo: d.memo, videoUrl: d.videoUrl })
    .then(function (res) {
      if (res.error) { alert("保存に失敗しました: " + res.error); return; }
      delete airlogCache[current];
      airlogFormOpen[current] = false;
      loadAirlog(current);
      render();
    });
};

window.setNoteDraft = function (v) { noteDraft[current] = v; };
window.sendNote = function () {
  var text = (noteDraft[current] || "").trim();
  if (!text) return;
  var sender = VIEW_MODE === "player" ? "athlete" : "coach";
  apiPost({ type: "addCoachNote", token: tokenFor(current), sender: sender, text: text })
    .then(function (res) {
      if (res.error) { alert("送信に失敗しました: " + res.error); return; }
      noteDraft[current] = "";
      delete notesCache[current];
      loadNotes(current);
      render();
    });
};

/* ---------------- カード描画 ---------------- */

function cardWrap(tone, title, bodyHtml) {
  return '<div class="card"><div class="card-head ' + tone + '"><span class="dot"></span><h2>' + escHtml(title) + '</h2></div><div class="card-body">' + bodyHtml + '</div></div>';
}

function renderSeasonCard(name) {
  var c = seasonCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var d = c.data;
    if (d.error) body = '<div class="muted">' + escHtml(d.error) + '</div>';
    else if (!d.hasEntry) body = '<div class="muted">まだシーズン目標が登録されていません</div>';
    else {
      var GOAL_LABELS = { "成績": "今年達成したい大会成績", "技術": "今年伸ばしたい技術", "フィジカル": "今年伸ばしたい身体能力", "メンタル": "今年強くしたいこと", "学校生活": "学校で頑張りたいこと", "人間性": "競技以外で成長したいこと" };
      var goals = d.goals || {};
      var goalsHtml = Object.keys(GOAL_LABELS).map(function (key) {
        var v = goals[key];
        if (!v) return "";
        return '<div class="field"><div class="k">' + escHtml(GOAL_LABELS[key]) + '（' + escHtml(key) + '）</div><div class="v">' + escHtml(v) + '</div></div>';
      }).join("");

      var ratings = d.selfRatings || [];
      var ratingsHtml = ratings.length ? '<div class="subhead">自己分析（5段階評価）</div>' + ratings.map(function (r) {
        return '<div class="rating-row"><span class="rn">' + escHtml(r.label) + '</span><span class="rv">' + (r.score == null ? "-" : r.score) + ' / 5</span></div>';
      }).join("") : "";

      var topTwoHtml = (d.topTwo && d.topTwo.length) ? '<div class="subhead">特に伸ばしたい項目</div><div class="chip-row">' + d.topTwo.map(function (t) { return '<span class="chip">' + escHtml(t) + '</span>'; }).join("") + '</div>' : "";

      var cp = d.competitionPlans || {};
      var cpRows = [
        ["今シーズン・規定演技", cp.thisSeasonRule],
        ["今シーズン・自由演技", cp.thisSeasonFree],
        ["来シーズン・規定演技", cp.nextSeasonRule],
        ["来シーズン・自由演技", cp.nextSeasonFree]
      ].filter(function (p) { return p[1]; });
      var cpHtml = cpRows.length ? '<div class="subhead">大会使用予定の演技</div>' + cpRows.map(function (p) {
        return '<div class="field"><div class="k">' + escHtml(p[0]) + '</div><div class="v">' + escHtml(p[1]) + '</div></div>';
      }).join("") : "";

      body = goalsHtml + ratingsHtml + topTwoHtml + cpHtml +
        (d.timestamp ? '<div class="field" style="margin-top:10px;"><div class="k">記入日</div><div class="v">' + escHtml(fmtDate(d.timestamp)) + '</div></div>' : "");
    }
  }
  return cardWrap("", "シーズン目標", body);
}

function renderMandalaCard(name) {
  var c = mandalaCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var d = c.data;
    if (d.error) body = '<div class="muted">' + escHtml(d.error) + '</div>';
    else if (!d.grid) {
      body = '<div class="muted">まだマンダラチャートが作成されていません</div>' +
        (d.editUrl ? '<a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">＋ マンダラシートを開いて記入する</a>' : "");
    } else {
      var grid = d.grid;
      var cells = "";
      for (var r = 0; r < 9; r++) {
        for (var col = 0; col < 9; col++) {
          var text = grid[r][col];
          var isCenter = (r === 4 && col === 4);
          var isBlockCenter = !isCenter && (r % 3 === 1) && (col % 3 === 1);
          var cls = "mandala-cell9" + (isCenter ? " center-goal" : isBlockCenter ? " block-center" : "") + (!text ? " empty" : "");
          cells += '<div class="' + cls + '">' + escHtml(text || "") + '</div>';
        }
      }
      body = '<div class="mandala-grid9">' + cells + '</div>' +
        (d.updatedAt ? '<div class="field" style="margin-top:10px;"><div class="k">更新日</div><div class="v">' + escHtml(fmtDate(d.updatedAt)) + '</div></div>' : "") +
        (d.editUrl ? '<a class="mandala-link" href="' + escHtml(d.editUrl) + '" target="_blank" rel="noopener">シートを開いて編集する</a>' : "");
    }
  }
  return cardWrap("gold", "マンダラチャート", body);
}

function renderStgCard(name) {
  var c = stgCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var d = c.data;
    if (!d.entry) body = '<div class="muted">まだ回答がありません</div>';
    else {
      var e = d.entry;
      body =
        (e.timestamp ? '<div class="field"><div class="k">記入日</div><div class="v">' + escHtml(fmtDate(e.timestamp)) + '</div></div>' : '') +
        (e.reflection ? '<div class="field"><div class="k">前回の振り返り</div><div class="v">' + escHtml(e.reflection) + '</div></div>' : '') +
        (e.newGoal ? '<div class="field"><div class="k">新しい目標</div><div class="v">' + escHtml(e.newGoal) + '</div></div>' : '') +
        (e.wantToTry ? '<div class="field"><div class="k">挑戦したい技</div><div class="v">' + escHtml(e.wantToTry) + '</div></div>' : '');
    }
  }
  return cardWrap("", "短期目標（月次振り返り）", body);
}

function renderAirlogCard(name) {
  var c = airlogCache[name];
  var listHtml;
  if (!c || c.status === "loading") listHtml = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") listHtml = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var records = (c.data && c.data.records) || [];
    if (!records.length) listHtml = '<div class="muted">まだ記録がありません</div>';
    else {
      listHtml = records.slice(0, 15).map(function (r) {
        var rate = (r.reps && r.success) ? Math.round((r.success / r.reps) * 100) + "%" : "";
        return '<div class="log-row"><div><div class="main">' + escHtml(r.technique) + '</div><div class="sub">' + escHtml(fmtDate(r.timestamp)) + (r.memo ? " ・ " + escHtml(r.memo) : "") + '</div></div><div class="stat">' + escHtml(r.success || "-") + '/' + escHtml(r.reps || "-") + (rate ? ' <span class="muted">' + rate + '</span>' : '') + '</div></div>';
      }).join("");
    }
  }
  var open = !!airlogFormOpen[name];
  var draft = airlogDraft[name] || { group: SKILL_GROUPS[0].label, skill: SKILL_GROUPS[0].skills[0] };
  var formHtml = "";
  if (open) {
    var groupOpts = SKILL_GROUPS.map(function (g) {
      return '<option value="' + escHtml(g.label) + '"' + (g.label === draft.group ? " selected" : "") + '>' + escHtml(g.label) + '</option>';
    }).join("");
    var curGroup = SKILL_GROUPS.filter(function (g) { return g.label === draft.group; })[0] || SKILL_GROUPS[0];
    var skillOpts = curGroup.skills.map(function (s) {
      return '<option value="' + escHtml(s) + '"' + (s === draft.skill ? " selected" : "") + '>' + escHtml(s) + '</option>';
    }).join("");
    formHtml =
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--gridline);">' +
      '<label class="lbl">技の分類</label><select onchange="setAirlogField(\'group\', this.value); render()">' + groupOpts + '</select>' +
      '<label class="lbl">技</label><select onchange="setAirlogField(\'skill\', this.value); render()">' + skillOpts + '</select>' +
      (draft.skill === "自由入力" ? '<label class="lbl">技名（自由入力）</label><input type="text" value="' + escHtml(draft.custom || "") + '" oninput="setAirlogField(\'custom\', this.value)">' : "") +
      '<label class="lbl">本数</label><input type="number" value="' + escHtml(draft.reps || "") + '" oninput="setAirlogField(\'reps\', this.value)">' +
      '<label class="lbl">成功数（かかり）</label><input type="number" value="' + escHtml(draft.success || "") + '" oninput="setAirlogField(\'success\', this.value)">' +
      '<label class="lbl">メモ</label><textarea oninput="setAirlogField(\'memo\', this.value)">' + escHtml(draft.memo || "") + '</textarea>' +
      '<label class="lbl">動画URL（任意）</label><input type="url" value="' + escHtml(draft.videoUrl || "") + '" oninput="setAirlogField(\'videoUrl\', this.value)">' +
      '<div class="btn-row"><button class="btn btn-primary" onclick="saveAirlogEntry()">保存</button><button class="btn btn-ghost" onclick="toggleAirlogForm()">キャンセル</button></div>' +
      '</div>';
  }
  var toggleBtn = '<div class="btn-row"><button class="btn ' + (open ? "btn-ghost" : "btn-primary") + '" onclick="toggleAirlogForm()">' + (open ? "閉じる" : "＋ 記録を追加") + '</button></div>';
  return cardWrap("green", "技・ジャンプ記録ログ", listHtml + toggleBtn + formHtml);
}

function renderNotesCard(name) {
  var c = notesCache[name];
  var body;
  if (!c || c.status === "loading") body = '<div class="loading-line">読み込み中…</div>';
  else if (c.status === "error") body = '<div class="muted">読み込みに失敗しました</div>';
  else {
    var notes = (c.data && c.data.notes) || [];
    var selfLabel = VIEW_MODE === "player" ? "本人" : "コーチ";
    var thread = notes.length
      ? notes.map(function (n) {
          var mine = n.sender === selfLabel;
          return '<div class="note-bubble ' + (mine ? "self" : "other") + '">' + escHtml(n.text) + '</div><div class="note-meta" style="text-align:' + (mine ? "right" : "left") + '">' + escHtml(n.sender) + " ・ " + escHtml(fmtDate(n.timestamp)) + '</div>';
        }).join("")
      : '<div class="muted">まだメッセージがありません</div>';
    body = thread +
      '<div style="margin-top:10px;"><textarea placeholder="メッセージを入力…" oninput="setNoteDraft(this.value)">' + escHtml(noteDraft[name] || "") + '</textarea>' +
      '<div class="btn-row"><button class="btn btn-primary" onclick="sendNote()">送信</button></div></div>';
  }
  return cardWrap("", "コーチへ共有メモ", body);
}

/* ---------------- 全体描画 ---------------- */

function renderSelector() {
  var el = document.getElementById("selector");
  if (VIEW_MODE !== "coach" || ATHLETES.length < 2) { el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = ATHLETES.map(function (a) {
    return '<button class="' + (a.name === current ? "active" : "") + '" onclick="selectAthlete(\'' + a.name + '\')">' + escHtml(a.name) + '</button>';
  }).join("");
}

function render() {
  renderSelector();
  var app = document.getElementById("app");
  if (fatalMessage) { app.innerHTML = '<div class="fatal">' + escHtml(fatalMessage) + '</div>'; return; }
  if (!current) { app.innerHTML = '<div class="loading-line">読み込み中…</div>'; return; }
  app.innerHTML =
    renderSeasonCard(current) +
    renderMandalaCard(current) +
    renderStgCard(current) +
    renderAirlogCard(current) +
    renderNotesCard(current);
}

/* ---------------- 起動 ---------------- */

function renderFatal(msg) { fatalMessage = msg; render(); }

async function initApp() {
  var urlToken = new URLSearchParams(location.search).get("token");
  try {
    if (urlToken) {
      var res = await apiGet("resolver", urlToken);
      if (res.error) { renderFatal("このリンクは無効です。お手数ですが保護者にご確認ください。"); return; }
      VIEW_MODE = "player";
      ATHLETES = [{ name: res.name, token: urlToken }];
      current = res.name;
      document.querySelector(".app-title").textContent = res.name + " の選手カルテ";
    } else {
      VIEW_MODE = "coach";
      var listRes = await apiListAthletes();
      if (!listRes.athletes || !listRes.athletes.length) { renderFatal("選手データを取得できませんでした。しばらくしてから再度お試しください。"); return; }
      ATHLETES = listRes.athletes;
      current = ATHLETES[0].name;
    }
    render();
    loadAllFor(current);
  } catch (err) {
    renderFatal("データの取得に失敗しました。時間をおいて再度お試しください（" + err + "）。");
  }
}

initApp();
</script>
</body>
</html>
